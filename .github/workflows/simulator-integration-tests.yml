name: 🖥️ Simulator Integration Tests

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      artifact_name:
        required: true
        type: string

  workflow_dispatch:
    inputs:
      version:
        description: LiteRT release version
        required: true
        default: "2.2.0"
        type: choice
        options:
          - "2.2.0"
          - "2.1.6"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-simulator-integration-tests-${{ github.ref }}
  cancel-in-progress: true

# Xcode 26 supports iOS 15+ Simulator runtimes. Xcode 27 starts at iOS 17.
# See https://developer.apple.com/xcode/system-requirements
env:
  XCODE_VERSION: "26.6"

jobs:
  package-managers:
    name: ${{ matrix.package_manager_name }}
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - package_manager: swiftpm
            package_manager_name: SwiftPM
          - package_manager: cocoapods
            package_manager_name: CocoaPods
    steps:
      - name: Checkout Repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Download LiteRT Artifacts
        if: inputs.artifact_name != ''
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ runner.temp }}/litert-artifacts

      - name: LiteRT Artifact Directory
        if: inputs.artifact_name != ''
        run: echo "LITERT_ARTIFACT_DIR=$RUNNER_TEMP/litert-artifacts" >> "$GITHUB_ENV"

      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"

      - name: Create Simulator
        env:
          IOS_RUNTIME: "26.5"
        run: |
          # https://github.com/actions/runner-images/issues/12862#issuecomment-3209385688
          xcrun simctl list > /dev/null
          RUNTIME_ID="com.apple.CoreSimulator.SimRuntime.iOS-${IOS_RUNTIME//./-}"
          SIMULATOR_ID="$(xcrun simctl create \
            "LiteRT iOS ${IOS_RUNTIME}" \
            com.apple.CoreSimulator.SimDeviceType.iPhone-13 \
            "$RUNTIME_ID")"
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"

      - name: Test Integration
        run: Tests/test-integration.sh simulator "${{ inputs.version }}" "${{ matrix.package_manager }}"

  # GitHub images retain only three runtime versions, explicitly installing each target is required.
  # The iOS 15.5 runtime is not available through xcodebuild -downloadPlatform for this Xcode and GitHub-hosted runner environment.
  # iOS 16 coverage ends when GitHub removes macos-26 or Xcode 26.
  # See https://github.com/actions/runner-images#support-policy
  ios-runtimes:
    name: iOS ${{ matrix.ios_runtime }}
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        ios_runtime:
          - "16.4"
          - "17.5"
          - "18.6"
          - "26.5"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Download LiteRT Artifacts
        if: inputs.artifact_name != ''
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ runner.temp }}/litert-artifacts

      - name: LiteRT Artifact Directory
        if: inputs.artifact_name != ''
        run: echo "LITERT_ARTIFACT_DIR=$RUNNER_TEMP/litert-artifacts" >> "$GITHUB_ENV"

      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"

      - name: Install Simulator Runtime
        env:
          IOS_RUNTIME: ${{ matrix.ios_runtime }}
        run: |
          # https://github.com/actions/runner-images/issues/12862#issuecomment-3209385688
          xcrun simctl list > /dev/null
          if [[ "$IOS_RUNTIME" != 26.5 ]]; then
            xcodebuild -downloadPlatform iOS -buildVersion "$IOS_RUNTIME"
          fi

      - name: Create Simulator
        env:
          IOS_RUNTIME: ${{ matrix.ios_runtime }}
        run: |
          RUNTIME_ID="com.apple.CoreSimulator.SimRuntime.iOS-${IOS_RUNTIME//./-}"
          SIMULATOR_ID="$(xcrun simctl create \
            "LiteRT iOS ${IOS_RUNTIME}" \
            com.apple.CoreSimulator.SimDeviceType.iPhone-13 \
            "$RUNTIME_ID")"
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"

      - name: Integration Tests
        run: Tests/test-integration.sh simulator "${{ inputs.version }}" swiftpm
